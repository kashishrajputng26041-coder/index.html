<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .a{
            height: 700px;
            width: 100%;
            background-image: url(https://media.istockphoto.com/id/1315112259/photo/light-blue-room-interior-design-with-furniture-blue-wall-and-parquet-floor-3d-render.jpg?s=170667a&w=0&k=20&c=dViiKVHep8UNSQWQN0sKlWX0AaRvut3uqShyUQXOV0Q=);
            background-repeat:no-repeat ;
            background-size: 100% auto;
            background-position: center;
            color: white;
        }
        /* Top NAVBAR */
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }
        .navbar h1{
            font-size: 30px;
        }
        .menu{
            display: flex;
            gap: 40px;
        }
        .menu a{
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        /* CENTER CONTENT */
        .content{
            text-align: center;
            padding-top: 180px;
        }
        .content p{
            width: 600px;
            margin: auto;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.5;
        }
        .cotent button{
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background-color: rgb(70, 14, 211);
            color: rgb(239, 227, 227);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        
    </style>
</head>

<body>
    <div class="a">
        <div class="navbar">
            <h1>NOVA</h1>
            <div class="menu">
                
                <a href="#"> Home</a>
                <a href="#"> About</a>
                <a href="#"> Contact</a>
                <a href="#"> Setting</a>

            </div>
        </div>
        <div class="content">
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Beatae doloribus dolor porro perferendis corrupti ipsam, ab cum voluptates molestias at. Saepe numquam aperiam labore enim necessitatibus consequuntur hic debitis iure.
            </p>
            <button> Explore</button>
        </div>

    </div>
</body>
</html>
